name: Entorii
options:
  bundleIdPrefix: com.diluk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: RH67B2MANC
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Entorii:
    type: application
    platform: iOS
    sources:
      - path: Entorii
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diluk.entorii
        PRODUCT_NAME: Entorii
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Entorii:
    build:
      targets:
        Entorii: all
    archive:
      config: Release
