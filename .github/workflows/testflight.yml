name: TestFlight

# Нативная сборка (SwiftUI + PencilKit) на Mac-сервере GitHub и отправка в TestFlight.
# Проект Xcode генерируется из project.yml через XcodeGen.
# Подпись автоматическая через ключ App Store Connect API (секреты репозитория):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (содержимое .p8 файла).
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Свежий Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Xcode: $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Ключ App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Сборка архива
        run: |
          set -o pipefail
          xcodebuild -project Entorii.xcodeproj -scheme Entorii -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/app.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=RH67B2MANC CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$((100 + ${{ github.run_number }})) 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|ARCHIVE" || true
          test -d build/app.xcarchive
      - name: Ошибки компиляции
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -50 || true
      - name: Отправка в TestFlight
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>upload</string>' \
            '<key>teamID</key><string>RH67B2MANC</string>' \
            '<key>signingStyle</key><string>automatic</string>' \
            '</dict></plist>' > build/export.plist
          xcodebuild -exportArchive -archivePath build/app.xcarchive -exportOptionsPlist build/export.plist \
            -exportPath build/out -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
